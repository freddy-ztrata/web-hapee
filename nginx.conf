# ── Idioma (2026-10-15) ──────────────────────────────────────────────────
# El sitio existe en tres idiomas: español en las URLs de siempre (/planes,
# /agenda-tu-demo…), inglés en /en/… y portugués en /pt/…, con el mismo slug.
# Inglés es el idioma por defecto: quien llega a una URL en español con el
# navegador en otro idioma que no sea español ni portugués va a /en/….
#
# Orden de preferencia:
#   1. cookie `hapee_lang` (es|en|pt) — la escribe el selector de idioma
#      (js/lang.js) cuando la persona elige a mano; manda sobre el navegador.
#   2. primer idioma de Accept-Language: es* → es, pt* → pt, cualquier otro → en.
#   3. sin cabecera (Googlebot y casi todos los crawlers no la mandan) → nada:
#      se sirve la URL pedida tal cual, así cada idioma se indexa en su URL.
map $cookie_hapee_lang $hapee_lang_cookie {
    ~^(es|en|pt)$ $1;
    default       "";
}
map $http_accept_language $hapee_lang_nav {
    ""          "";
    ~*^\s*es    es;
    ~*^\s*pt    pt;
    default     en;
}
map $hapee_lang_cookie $hapee_lang {
    ""      $hapee_lang_nav;
    default $hapee_lang_cookie;
}
# Las legales ya tenían traducción propia con otro nombre (2026-09-16) y no
# viven bajo /en/ ni /pt/.
map "$hapee_lang:$uri" $hapee_lang_legal {
    ~^en:/terminos(\.html)?$                /terms.html;
    ~^pt:/terminos(\.html)?$                /termos.html;
    ~^en:/politica-privacidad(\.html)?$     /privacy-policy.html;
    ~^pt:/politica-privacidad(\.html)?$     /politica-privacidade.html;
    default                                 "";
}
# /en/img/x.png → /img/x.png. Las páginas traducidas conservan las rutas
# relativas del original (img/…, assets/…, article.css); dentro de /en/ esas
# rutas apuntan a /en/img/…, que no existe. En vez de reescribir cada ruta en
# cada traducción, los assets se buscan primero en su ruta y después sin el
# prefijo de idioma. Hay una sola copia de cada imagen, script y vídeo.
# Ruta de la versión traducida de la página pedida; si el idioma es español o
# no se conoce, una ruta que no existe y el `location /` sirve la original.
map $hapee_lang $hapee_cand {
    en      /en$uri;
    pt      /pt$uri;
    default /__sin_traduccion__;
}
map $uri $hapee_sin_idioma {
    ~^/(?:en|pt)(/.*)$ $1;
    default            $uri;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Redirecciones con Location relativa (/en/planes). nginx corre detrás del
    # proxy TLS de Dokploy en el puerto 80: con la absoluta mandaba http://.
    absolute_redirect off;

    # Compresión. nginx:alpine la trae APAGADA y todo el sitio salía sin comprimir
    # (medido el 2026-09-25: el index.html de la oficina, 136 KB crudos). text/html se
    # comprime siempre; aquí van los demás textos y los binarios que sí ganan (el .hdr
    # y los .glb se sirven como octet-stream). Vídeo e imágenes ya vienen comprimidos.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/xml application/json application/javascript image/svg+xml application/octet-stream;

    # DNS resolver — Docker internal DNS (external DNS unreachable from container)
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Slug pre-lanzamiento del pricing → URL limpia (301 preserva query string)
    location = /planes-k9x2v7 { return 301 https://hapee.ai/planes$is_args$args; }
    location = /planes-k9x2v7.html { return 301 https://hapee.ai/planes$is_args$args; }

    # Assets estáticos: si falta el archivo, 404 de verdad. Sin esto caen al
    # fallback de abajo y devuelven la portada en HTML con estado 200, y un
    # archivo que no llegó al servidor parece estar bien.
    #
    # Caché (2026-10-15). Sin cabeceras, el navegador revalidaba cada imagen en
    # cada visita. Los nombres NO llevan hash, así que nada es `immutable`: un
    # archivo cambiado con el mismo nombre quedaría pegado un año en los
    # navegadores. Imágenes, fuentes, video y 3D: 30 días (si cambias una
    # imagen, cambia su nombre o agrégale ?v=N, como ya se hace con img/brands).
    # CSS y JS: 1 hora, porque se editan con el mismo nombre (js/lang.js…).
    location ~* \.(woff2?|ttf|otf|eot|png|jpe?g|webp|avif|svg|gif|ico|mp4|webm|glb|hdr)$ {
        try_files $uri $hapee_sin_idioma =404;
        add_header Cache-Control "public, max-age=2592000";
    }
    location ~* \.(css|js)$ {
        try_files $uri $hapee_sin_idioma =404;
        add_header Cache-Control "public, max-age=3600";
    }

    # Páginas en inglés y portugués. Una URL que no existe cae en la home de
    # SU idioma, no en la española. Los archivos que no son página (.glb, .hdr,
    # .json de oficina/ y via/) se buscan también sin el prefijo de idioma.
    location ~ ^/(?<hapee_pref>en|pt)(?:/|$) {
        try_files $uri $uri.html $uri/ $hapee_sin_idioma /$hapee_pref/index.html;
        # HTML: el navegador lo guarda pero pregunta siempre (304 si no cambió),
        # así un deploy se ve al instante.
        add_header Cache-Control "no-cache";
    }

    # Static files — clean URLs: try $uri, then $uri.html, then index.html
    # Antes de servir una página en español se mira el idioma (ver los `map`
    # de arriba): si es en/pt y la página existe traducida, 302 a esa versión.
    # 302 y no 301: la misma URL lleva a distintos sitios según quién la pida,
    # y un 301 lo cachea el navegador para siempre.
    location / {
        # La respuesta depende del idioma del navegador y de la cookie del
        # selector: un proxy o CDN delante no debe servir la de otra persona.
        add_header Vary "Accept-Language, Cookie";
        add_header Cache-Control "no-cache";
        if ($hapee_lang_legal != "") {
            return 302 $hapee_lang_legal$is_args$args;
        }
        # Sin `set` dentro de un `if`: un `if` que se cumple sin hacer `return`
        # deja la petición en su propio contexto, sin el try_files, y la página
        # sin traducir respondía 404. El candidato sale de un `map`.
        if (-f $document_root$hapee_cand) {
            return 302 $hapee_cand$is_args$args;
        }
        if (-f $document_root$hapee_cand.html) {
            return 302 $hapee_cand$is_args$args;
        }
        if (-f $document_root${hapee_cand}index.html) {
            return 302 $hapee_cand$is_args$args;
        }
        if (-f $document_root$hapee_cand/index.html) {
            return 302 $hapee_cand/$is_args$args;
        }
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Contrato OpenAPI para /docs/referencia, servido desde el mismo origen. Pedirlo
    # directo a beta.hapee.ai lo bloqueaba el navegador (sin cabecera CORS) y la
    # referencia quedaba en «Cargando…». Es el contrato vivo: 5 min de caché.
    location = /api/openapi.json {
        limit_except GET { deny all; }
        set $hapee_upstream https://beta.hapee.ai;
        rewrite ^ /api/v1/openapi.json break;
        proxy_pass $hapee_upstream;
        proxy_ssl_server_name on;
        proxy_set_header Host beta.hapee.ai;
        proxy_set_header Cookie "";
        proxy_set_header Accept-Encoding "";
        proxy_hide_header Set-Cookie;
        add_header Cache-Control "public, max-age=300";
        proxy_read_timeout 20s;
    }

    # Reverse proxy: Hapee app (checkout público de planes — pricing oculto).
    # Inyecta la api key server-side (misma técnica que /api/chat): sin la env
    # var SAAS_PUBLIC_API_KEY en Dokploy, la app rechaza todo con 404 (fail-secure).
    location /api/saas/ {
        limit_except GET POST { deny all; }

        set $hapee_upstream https://beta.hapee.ai;
        rewrite ^/api/saas/(.*)$ /api/public/saas/$1 break;
        proxy_pass $hapee_upstream;
        proxy_ssl_server_name on;
        proxy_set_header Host beta.hapee.ai;
        proxy_set_header X-Public-Api-Key "${SAAS_PUBLIC_API_KEY}";
        proxy_set_header Origin "";
        proxy_set_header Referer "";
        proxy_set_header Cookie "";
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Reverse proxy: Anthropic Claude API
    location /api/chat {
        limit_except POST { deny all; }

        set $anthropic_upstream https://api.anthropic.com;
        proxy_pass $anthropic_upstream/v1/messages;
        proxy_ssl_server_name on;
        proxy_set_header Host api.anthropic.com;
        proxy_set_header Content-Type "application/json";
        proxy_set_header x-api-key "${ANTHROPIC_API_KEY}";
        proxy_set_header anthropic-version "2023-06-01";
        proxy_set_header Origin "";
        proxy_set_header Referer "";
        proxy_set_header Cookie "";
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;
    }

    # Reverse proxy: ElevenLabs TTS (streaming)
    location ~ ^/api/tts/(.+)$ {
        limit_except POST { deny all; }

        set $voice_id $1;
        set $eleven_upstream https://api.elevenlabs.io;
        proxy_pass $eleven_upstream/v1/text-to-speech/$voice_id/stream;
        proxy_ssl_server_name on;
        proxy_set_header Host api.elevenlabs.io;
        proxy_set_header Content-Type "application/json";
        proxy_set_header xi-api-key "${ELEVENLABS_API_KEY}";
        proxy_set_header Origin "";
        proxy_set_header Referer "";
        proxy_set_header Cookie "";
        proxy_set_header Accept-Encoding "";
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
